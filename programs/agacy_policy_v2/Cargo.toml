[package]
name = "agacy_policy_v2"
version = "0.1.0"
description = "PDA-based Agacy spend policy, delegate-bindable via CPI (see docs/PRIVACY_ARCHITECTURE.md section 14)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "agacy_policy_v2"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
# Ristretto add/subtract. On-chain these are syscalls; off-chain (and in
# litesvm tests) the same crate falls back to curve25519-dalek, so the
# homomorphic arithmetic is identical in both places.
solana-curve25519 = "3.1.14"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
